<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Habitizer</title>
    <script>
      try {
        const stored = localStorage.getItem("habitizer-settings-v1");
        if (stored && JSON.parse(stored).darkMode) {
          document.documentElement.dataset.theme = "dark";
        }
      } catch {}
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button id="backButton" class="icon-btn hidden" aria-label="Go back">←</button>
        <button id="menuButton" class="icon-btn hidden" aria-label="Menu">⋯</button>
        <h1 id="pageTitle">Habitizer</h1>
        <button id="addButton" class="icon-btn primary" aria-label="Add">+</button>
      </header>

      <main id="app" class="app-content" aria-live="polite"></main>

      <div id="undoToast" class="undo-toast hidden" role="status" aria-live="polite">
        <span id="undoToastMessage" class="undo-toast-message"></span>
        <button id="undoToastAction" type="button" class="undo-toast-btn">Undo</button>
      </div>
    </div>

    <div id="nameModal" class="modal-overlay hidden" aria-hidden="true">
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <h2 id="modalTitle">New routine</h2>
        <label id="modalLabel" class="modal-label" for="modalInput">Name</label>
        <input id="modalInput" class="modal-input" type="text" maxlength="40" autocomplete="off" />
        <div id="modalMinutesGroup" class="modal-field-group hidden">
          <label id="modalMinutesLabel" class="modal-label" for="modalMinutesInput">Estimated time (minutes)</label>
          <input id="modalMinutesInput" class="modal-input" type="number" min="0" step="1" placeholder="15" autocomplete="off" />
        </div>
        <div id="modalColorGroup" class="modal-field-group hidden">
          <span id="modalColorLabel" class="modal-label">Color</span>
          <div id="modalColorSwatches" class="modal-color-swatches" role="radiogroup" aria-label="Routine color"></div>
        </div>
        <div class="modal-actions">
          <button id="modalCancel" type="button" class="secondary-btn">Cancel</button>
          <button id="modalConfirm" type="button" class="primary-btn">Create</button>
        </div>
      </div>
    </div>

    <div id="settingsModal" class="modal-overlay hidden" aria-hidden="true">
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <h2 id="settingsTitle">Settings</h2>
        <div class="settings-content">
          <label class="settings-row" for="darkModeToggle">
            <span class="settings-copy">
              <span class="settings-title">Dark mode</span>
              <p class="settings-desc">Use a darker theme that's easier on the eyes at night.</p>
            </span>
            <input id="darkModeToggle" class="toggle-input" type="checkbox" role="switch" aria-label="Dark mode" />
          </label>
          <label class="settings-row" for="cumulativeToggle">
            <span class="settings-copy">
              <span class="settings-title">Cumulative Habit Tracker</span>
              <p class="settings-desc">Times accumulate across multiple runs. Turn off for per-session mode.</p>
            </span>
            <input id="cumulativeToggle" class="toggle-input" type="checkbox" role="switch" aria-label="Cumulative habit tracker" />
          </label>
        </div>
        <section class="settings-deleted-section" aria-labelledby="deletedRoutinesTitle">
          <h3 id="deletedRoutinesTitle" class="settings-section-title">Recently deleted</h3>
          <p class="settings-section-desc">Routines stay here for 30 days.</p>
          <div id="deletedRoutinesList" class="deleted-routines-list"></div>
        </section>
        <div class="modal-actions">
          <button id="settingsClose" type="button" class="primary-btn">Done</button>
        </div>
      </div>
    </div>

    <div id="confirmModal" class="modal-overlay hidden" aria-hidden="true">
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
        <h2 id="confirmTitle">Confirm</h2>
        <p id="confirmMessage" class="confirm-message"></p>
        <div class="modal-actions">
          <button id="confirmCancel" type="button" class="secondary-btn">Cancel</button>
          <button id="confirmAction" type="button" class="danger-btn">Confirm</button>
        </div>
      </div>
    </div>

    <div id="colorModal" class="modal-overlay hidden" aria-hidden="true">
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="colorModalTitle">
        <h2 id="colorModalTitle">Routine color</h2>
        <div id="colorModalSwatches" class="color-modal-swatches" role="radiogroup" aria-label="Routine color"></div>
        <div class="modal-actions">
          <button id="colorModalClose" type="button" class="primary-btn">Done</button>
        </div>
      </div>
    </div>

    <div id="calendarModal" class="modal-overlay hidden" aria-hidden="true">
      <div class="modal-card calendar-modal-card" role="dialog" aria-modal="true" aria-labelledby="calendarModalTitle">
        <h2 id="calendarModalTitle">Completion history</h2>
        <p id="calendarModalSubtitle" class="calendar-modal-subtitle hidden"></p>
        <div id="calendarModalBody"></div>
        <div class="modal-actions">
          <button id="calendarModalClose" type="button" class="primary-btn">Done</button>
        </div>
      </div>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
